name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Test and build
        run: gradle --no-daemon testReleaseUnitTest assembleRelease

      - name: Collect APK
        run: cp app/build/outputs/apk/release/app-release.apk calc.apk

      - uses: actions/upload-artifact@v4
        with:
          name: calc-apk
          path: calc.apk

      # One rolling release, so the download link never changes:
      # https://github.com/krasn0w/calc/releases/latest/download/calc.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag -y || true
          gh release create latest calc.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Calc · сборка ${GITHUB_RUN_NUMBER}" \
            --notes "Скачайте calc.apk на телефон и установите поверх прежней версии."

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: calc-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: python3 .github/smoke.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-shots
          path: shots/
